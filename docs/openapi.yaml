openapi: 3.1.0

# The session-broker HTTP contract.
#
# Hand-written rather than generated. The endpoints are few and stable, and the
# thing worth documenting here is not the shapes — it is which LISTENER each
# endpoint is on and what each refusal means, neither of which a code generator
# would infer. Keep this in step with `docs/architecture/implementation-strategy.md` §4.
#
# THREE LANES, TWO LISTENERS:
#
#   public   (bind_addr)          /auth/*, /session*, /logout   — the browser
#                                 /auth/token, /auth/jwks.json,
#                                 /.well-known/oauth-authorization-server
#                                                               — token issuer (ADR-0017)
#   internal (internal_bind_addr) /internal/token               — backend services
#   internal (internal_bind_addr) /admin/*                      — operators/console
#                                 (incl. principals, grants, signing keys)
#
# The internal listener must not be internet-reachable. Both lanes on it still
# require authentication regardless, because a bind address is a deployment
# promise rather than an enforced invariant.

info:
  title: session-broker
  version: 0.1.0
  summary: Brokers browser sessions against an upstream OIDC provider and takes custody of the upstream tokens.
  description: |
    Three properties define the service, in priority order:

    1. **Non-invalidating rotation.** Issuing a new session cookie does not
       invalidate the previous one; generations overlap for a grace window.
       This removes the refresh race class outright rather than coordinating
       around it.
    2. **Local-only fast refresh.** Session lifetime is decoupled from upstream
       token lifetime. `POST /session/refresh` performs no network I/O (INV-8).
    3. **Server-side guarantees, dumb client.** The browser SDK needs no
       cross-tab coordination beyond one Web Lock.

    ## Cookies

    - `__Host-broker_session` (`broker_session` over loopback) — `HttpOnly`,
      `SameSite=Lax`. The credential. Never readable by script.
    - `broker_meta` — deliberately readable by script (INV-9), and deliberately
      **unsigned**. It is a client hint. The server never reads it back, and
      signing it would imply it could be trusted as input.

    ## CSRF

    Same-origin path-mounted deployment is the default (INV-10, ADR-0012), so
    there is no CORS surface. The CSRF boundary is `Sec-Fetch-Site` / `Origin`
    on unsafe methods (ADR-0004), which the browser sets and script cannot forge.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: https://app.example.com
    description: Public lane, path-mounted on the SPA's own origin (ADR-0012).
  - url: http://127.0.0.1:8090
    description: Internal lane — token exchange and admin. Not internet-reachable.

tags:
  - name: auth
    description: OAuth2/OIDC authorization-code entry path (public lane).
  - name: session
    description: Session lifecycle (public lane). No network I/O on the hot path.
  - name: internal
    description: Backend token exchange (internal lane, dual authentication).
  - name: admin
    description: Key, session and custody management (internal lane).
  - name: issuer
    description: |
      The broker as a token issuer (ADR-0017). Off until `token_issuer` and
      `issuer_audiences` are set; off, the public routes answer
      `501 lane_disabled`. Public lane: `POST /auth/token` (machines),
      `POST /session/token` (people), and the keys and metadata that verify
      what they return. Internal lane: tenants, service principals and their
      secrets, user grants and signing keys, all behind the admin key and all
      audited in the same transaction (INV-13).
  - name: ops
    description: |
      Observability (internal lane). Two planes with different promises:
      diagnostics are lossy and shipped by the deployment, the audit record is
      durable and queryable here. See ADR-0014 and ADR-0015.

paths:
  /healthz:
    get:
      tags: [session]
      summary: Liveness. Present on BOTH listeners.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema: { type: string, example: ok }

  /auth/login:
    get:
      tags: [auth]
      summary: Begin a login.
      description: |
        Starts a server-side login transaction (INV-3) — `state`, PKCE verifier
        and `nonce` are stored server-side and the browser receives only an
        opaque txn id in `__Host-broker_txn` — then redirects to the IdP.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: |
            Where to land after a successful callback. Must be a **same-origin
            absolute path** (INV-4). Anything else is rejected outright rather
            than silently downgraded: nothing has been created yet, so there is
            nothing to protect by continuing.
          schema: { type: string, example: /dashboard }
      responses:
        "303":
          description: Redirect to the IdP's authorization endpoint.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie:
              description: "`__Host-broker_txn`, `HttpOnly`, `Max-Age=600`."
              schema: { type: string }
        "400":
          description: "`return_to` was not a same-origin absolute path."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/callback:
    get:
      tags: [auth]
      summary: Redeem the authorization code and mint a session.
      description: |
        The txn is consumed on FIRST TOUCH, success or failure alike (INV-3c),
        so a replayed callback finds nothing.

        Every failure — missing txn cookie, `state` mismatch, expired txn, failed
        exchange, bad `id_token`, or custody that could not be persisted — lands
        on the error page and creates **no session**. There is no partial success:
        a session without a durable upstream grant would appear to work and be
        unable to do anything.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: The IdP-reported-error form. }
      responses:
        "303":
          description: |
            On success, redirect to the txn's stored `return_to` with the session
            and meta cookies set. On any failure, redirect to
            `/error?error=oauth_error` with no session.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }

  /session:
    get:
      tags: [session]
      summary: The current session's meta.
      description: Read-only. Answers from memory; performs no I/O.
      responses:
        "200":
          description: A live session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "401":
          description: No session, or one that no longer authenticates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /session/refresh:
    post:
      tags: [session]
      summary: Rotate (or coalesce onto) the current generation.
      description: |
        **Performs no network I/O** (INV-8) — it never calls the IdP. Refreshes
        arriving within the coalesce window re-issue the current generation
        rather than minting, so N concurrent refreshes mint exactly once.

        Rotation is non-invalidating: the previous cookie stays valid for the
        grace window, which is why a client needs no cross-tab coordination.
      responses:
        "200":
          description: Session refreshed. Both cookies re-issued.
          headers:
            Set-Cookie: { schema: { type: string } }
            X-Broker-Handler-Us:
              description: Server-side handler time in microseconds, for the demo's RTT panel.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "401":
          description: Unknown token, a retired generation, or an expired session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: The CSRF boundary refused this request (ADR-0004).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    get:
      tags: [session]
      summary: Interactive refresh — a browser navigation, not a fetch.
      parameters:
        - { name: interactive, in: query, schema: { type: string, enum: ["1"] } }
        - { name: return_to, in: query, schema: { type: string } }
      responses:
        "303":
          description: Redirect back to `return_to`, or to login if the session is gone.

  /logout:
    post:
      tags: [session]
      summary: End the session everywhere.
      description: |
        One tombstone kills every generation at once (INV-7, ADR-0010). Clearing
        an already-expired session still succeeds — logout must never fail.
      responses:
        "204":
          description: Session ended; both cookies expired.
          headers:
            Set-Cookie: { schema: { type: string } }

  /auth/token:
    post:
      tags: [issuer]
      summary: Trade a service principal's secret for a signed token (client credentials).
      description: |
        OAuth 2.0 client credentials (RFC 6749 section 4.4) on the **public**
        listener, because the machines that call it sit outside the operator
        network. Answers `501 lane_disabled` until `token_issuer` and
        `issuer_audiences` are configured.

        **Every claim comes from the principal's row.** The request chooses only
        a narrower `scope` and a shorter `ttl`. `tenant`, `audience` and any other
        field are ignored, so a caller cannot ask for a different tenant.

        The id and secret go either in the form body (`client_id`,
        `client_secret`) or in HTTP Basic. Both secret locations at once is
        `invalid_request`, and so is any parameter sent twice.

        **One refusal for every dead credential.** An unknown id, a wrong,
        revoked or expired secret, a revoked principal and a disabled tenant all
        answer the same `401 invalid_client`, so the route cannot be used to learn
        which is true.

        **Wrong credentials are budgeted per `client_id`**, not per address, so
        the limit works with no client-IP header configured. Ids that name no
        principal share one budget. Only a failure spends from it, and it is spent
        after the check, so the holder of the right secret is never locked out by
        someone guessing against its id. Successful issuance is not limited.

        An issued token cannot be revoked before it expires. Revoking the
        principal or the secret stops the next one.
      security:
        - principalSecret: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, const: client_credentials }
                client_id:
                  type: string
                  example: sp_a1b2c3d4e5f6g7h8
                  description: The principal id. Omit when using HTTP Basic.
                client_secret:
                  type: string
                  example: sbp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                  description: The principal's secret. Omit when using HTTP Basic.
                scope:
                  type: string
                  description: Space-separated; must be a subset of the principal's scopes. Default is all of them.
                ttl:
                  type: integer
                  minimum: 1
                  description: Seconds. At most the principal's `max_ttl_secs` and the issuer's maximum.
      responses:
        "200":
          description: A signed token.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: |
            `invalid_request` (not a form, missing `grant_type`, a parameter sent
            twice, Basic plus a body secret, a bad `ttl`), `unsupported_grant_type`,
            `invalid_scope` (not a subset of the principal's), or
            `unauthorized_client` (the principal's audience is not in
            `issuer_audiences`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: "`invalid_client`. One identical body for every reason a credential does not work."
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Basic realm="session-broker", charset="UTF-8"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "413":
          description: "`invalid_request`. The body is over the 64 KiB limit."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "429":
          description: "`rate_limited`. Too many wrong credentials for this client id. Past the budget a wrong guess is no longer audited."
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "501":
          description: "`lane_disabled`. The issuer is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "503":
          description: "`temporarily_unavailable`. The store could not be read or no signing key is usable. Retry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /auth/jwks.json:
    get:
      tags: [issuer]
      summary: The keys that verify issued tokens.
      description: |
        Every **published** signing key, newest first: the one signing now,
        older ones whose tokens may still be in flight, and pending ones that
        start signing later (so a verifier learns a key before any token carries
        it). Public by design; the keys are public keys.

        Meant to be cached. `Cache-Control: public, max-age=<issuer_jwks_max_age_secs>,
        stale-if-error=2592000`, an `ETag` that makes a refresh a 304, and a
        `Date` header so a verifier can measure clock drift. See
        `docs/verifier/README.md` for the cache policy.
      security: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The JWK Set.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=300, stale-if-error=2592000" } }
            ETag: { schema: { type: string } }
            Date: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
        "304":
          description: The caller's copy is current. Same headers, no body.
        "501":
          description: "`lane_disabled`. The issuer is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }

  /.well-known/oauth-authorization-server:
    get:
      tags: [issuer]
      summary: Issuer metadata (RFC 8414).
      description: |
        Names the issuer, where its keys are and where to ask for a token. Only
        what exists is listed. Cached exactly like `/auth/jwks.json`.
      security: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The metadata document.
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=300, stale-if-error=2592000" } }
            ETag: { schema: { type: string } }
            Date: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerMetadata" }
        "304":
          description: The caller's copy is current. Same headers, no body.
        "501":
          description: "`lane_disabled`. The issuer is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }

  /session/token:
    post:
      tags: [issuer]
      summary: Trade the signed-in session for a signed user token.
      description: |
        For a console or app acting for a signed-in person. Cookie-authenticated
        and held to the same bar as every state-changing cookie route: the INV-2
        same-origin check runs first, then the session must be `Active`, exactly
        as `/authz` and `/internal/token` require. A stale generation is told to
        refresh first.

        **Tenant, roles and indexes come only from the broker's `user_grant`
        table** for the session's subject. The request chooses an audience (one
        of `issuer_audiences`) and, for a person with several grants, which
        tenant. Nothing the identity provider sent is read.

        A subject the table has never held a row for gets `default_user_tenant`
        (default `default`) with `default_user_roles` (default `viewer`) and
        `indexes: ["*"]`, so a single-tenant install needs no admin step. A
        subject whose every grant was revoked, or whose tenant is disabled, is
        **not** rescued by the default: `403 not_granted`.

        Lifetime is `issuer_user_ttl_secs`, cut short at the session's idle
        expiry. `sid` in the token is the broker's session id, never the cookie.
        The endpoint is drivable by script on the app origin, the same residual
        ADR-0007 states for refresh.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience: { type: string, example: logless, description: One of the configured `issuer_audiences`. }
                tenant:
                  type: string
                  description: Required only when the person holds grants on several tenants.
      responses:
        "200":
          description: A signed user token.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserTokenResponse" }
        "400":
          description: |
            `bad_request` (unreadable body, or several grants and no `tenant`)
            or `bad_audience` (not in `issuer_audiences`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "`invalid_session` (no or unknown cookie), `session_stale` (refresh, then retry) or `session_expired`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "`csrf_rejected` (INV-2) or `not_granted` (no grant for that tenant, or the person has none and no default applies)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "501":
          description: "`lane_disabled`. The issuer is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: "`unavailable`. The store could not be read or no signing key is usable."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /internal/token:
    post:
      tags: [internal]
      summary: Exchange a session token for the custodied upstream access token.
      description: |
        **Dual authentication, and neither half is sufficient** (INV-11, ADR-0007):

        - a broker API key proves the caller is a trusted backend — on its own it
          cannot name a user;
        - a live session token proves *which* user — on its own it yields nothing,
          which is what stops a cookie stolen by XSS from being exchanged, since
          the browser does not hold the key.

        This route is unchanged by the token issuer: it still returns the
        upstream token. A broker-signed token for a signed-in person comes from
        `POST /session/token`.

        **No inline refresh.** If the custodied access token has expired this
        answers `custody_unavailable` rather than calling the IdP (INV-8): a
        backend seeing it should retry, not treat it as an auth failure.

        Two kinds of key work here. Keys **issued** through `/admin/api-keys` are
        the normal case and can be revoked without a restart. The single
        **bootstrap** key from config exists so the first issued key can be
        created, and cannot be revoked without a deploy.
      security:
        - brokerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token:
                  type: string
                  description: The raw session cookie value, forwarded by the backend.
      responses:
        "200":
          description: The current upstream access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, sub, expires_at]
                properties:
                  access_token: { type: string }
                  sub:
                    type: string
                    description: The IdP subject. Opaque — map it to your own user model.
                  expires_at: { type: integer, description: Unix seconds. }
                  scope: { type: [string, "null"] }
        "401":
          description: |
            `missing_api_key` / `bad_api_key` — the CALLER's credential is wrong;
            an operator problem, not the user's.
            `session_not_active` — the session does not authenticate resource access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "501":
          description: "`lane_disabled` — no broker API keys are configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "503":
          description: |
            `upstream_revoked` — the grant behind this session is dead.
            `custody_unavailable` — the access token has expired and has not yet
            been renewed by the keepalive worker. **Retry; do not log the user out.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }

  /admin/api-keys:
    get:
      tags: [admin]
      summary: List backend API keys.
      description: |
        Live and revoked, newest first. Revoked keys are kept rather than deleted
        — "this key was revoked last Tuesday" is the answer an incident review
        needs. **Secrets are never returned.**
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [admin]
      summary: Issue a new backend API key.
      description: |
        **The secret is returned exactly once, here.** Only its SHA-256 is
        stored, and no endpoint reveals it afterwards — a leaked console database
        should expose *who holds access*, not the access itself. Losing a key
        means issuing a new one.
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Which backend this key is for. Five keys named "key" answer nothing during an incident.
      responses:
        "201":
          description: Key issued. Store the secret now; it cannot be retrieved again.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, name, secret, created_at]
                properties:
                  key_id: { type: string, example: bk_9f3a2c1b7d4e6f80 }
                  name: { type: string }
                  secret: { type: string, description: Shown once. Not recoverable. }
                  created_at: { type: integer }
        "400":
          description: "`name_required`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/api-keys/{key_id}:
    delete:
      tags: [admin]
      summary: Revoke a key.
      description: |
        Takes effect on the next request — there is no cache to wait out and no
        restart required, which is what makes this meaningful rather than
        advisory.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: key_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404":
          description: |
            `unknown_key` — no LIVE key with that id. Reported rather than
            swallowed: "revoked" and "there was nothing to revoke" must not look
            alike to someone racing to cut off access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/sessions:
    get:
      tags: [admin]
      summary: List live sessions.
      description: |
        Read from the store, not the in-memory map: the map holds token hashes,
        and an admin surface has no business near credential material even in
        hashed form.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Live sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/sessions/{sid}:
    delete:
      tags: [admin]
      summary: Force-logout a session.
      description: Kills every generation at once (INV-7), in memory and durably.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/custody:
    get:
      tags: [admin]
      summary: Upstream grant health.
      description: |
        Excludes `dead` custodies, whose grant will never work again. A session
        can be perfectly valid while the token behind it is degraded — this is
        where that shows.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Custody schedule and health.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Custody" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/tenants:
    get:
      tags: [issuer]
      summary: List tenants.
      description: |
        Ordered by tenant id. `default` is pre-seeded. A tenant is a label that
        scopes what a consumer lets a token do; it is not an isolation boundary
        inside the broker (ADR-0017).
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: The tenants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [issuer]
      summary: Create a tenant.
      description: |
        Optional. Naming a new tenant slug on a principal or a user grant creates
        it in the same transaction, so nobody has to call this first. Tier A
        (`tenant.created`).
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant]
              properties:
                tenant: { $ref: "#/components/schemas/Slug" }
                display_name: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400":
          description: "`bad_request`, `invalid_tenant` or `invalid_display_name`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "409":
          description: "`tenant_exists`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/tenants/{tenant}:
    delete:
      tags: [issuer]
      summary: Disable a tenant.
      description: |
        Its principals stop resolving at once (new tokens are refused as
        `invalid_client`), its user grants stop counting, and it takes no new
        principals or grants. Tokens already issued live out their lifetime.
        Undo with `POST /admin/tenants/{tenant}/enable`. A disabled `default`
        tenant also stops the single-tenant default for users. Tier A
        (`tenant.disabled`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "204": { description: Disabled. }
        "404":
          description: "`unknown_tenant`. No enabled tenant with that name."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/tenants/{tenant}/enable:
    post:
      tags: [issuer]
      summary: Enable a disabled tenant.
      description: Gives the tenant's principals and grants back. Tier A (`tenant.enabled`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: tenant, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "204": { description: Enabled. }
        "404":
          description: "`unknown_tenant`. No disabled tenant with that name; an unknown tenant and an already-enabled one look alike."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/principals:
    get:
      tags: [issuer]
      summary: List service principals.
      description: Live and revoked, newest first, at most 64. Secrets are never returned.
      security: [{ adminApiKey: [] }]
      parameters:
        - name: tenant
          in: query
          required: false
          description: Only this tenant's principals.
          schema: { $ref: "#/components/schemas/Slug" }
      responses:
        "200":
          description: The principals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [issuer]
      summary: Create a service principal and its first secret.
      description: |
        The simple path: create a principal, take the secret, paste it into the
        machine's config. **The secret is returned exactly once, here**; only its
        SHA-256 is stored. It does not expire unless `expires_in_secs` is given.

        The request body rejects unknown fields, so a typo such as `tenant_id`
        cannot silently land a principal in `default`. A tenant slug that does not
        exist yet is created in the same transaction. `audience` is checked for
        shape only here; `/auth/token` refuses a principal whose audience is not
        in `issuer_audiences`. Principals are not backend API keys: nothing on
        `/internal/token`, `/authz` or `/admin/*` can resolve a principal secret.
        Tier A (`principal.created`).
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPrincipal" }
      responses:
        "201":
          description: Created. Store the secret now; it cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedPrincipal" }
        "400":
          description: |
            `bad_request`, `invalid_tenant`, `invalid_name`, `invalid_kind`,
            `invalid_scopes`, `invalid_indexes`, `invalid_audience`,
            `max_ttl_out_of_range`, `expiry_out_of_range`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "409":
          description: |
            `principal_exists` (the name is taken in that tenant, revoked
            principals included, because the name stays reserved) or
            `tenant_disabled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/principals/{principal_id}:
    get:
      tags: [issuer]
      summary: One principal, with its secrets.
      description: Secret ids and dates only. Never a secret.
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrincipalId" }
      responses:
        "200":
          description: The principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrincipalDetail" }
        "404":
          description: "`unknown_principal`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    delete:
      tags: [issuer]
      summary: Revoke a principal.
      description: |
        Stops new tokens at once. Tokens already issued live out their lifetime;
        there is no revocation list. The principal's name stays reserved. Tier A
        (`principal.revoked`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrincipalId" }
      responses:
        "204": { description: Revoked. }
        "404":
          description: "`unknown_principal`. No live principal with that id."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/principals/{principal_id}/secrets:
    post:
      tags: [issuer]
      summary: Add a secret to a principal.
      description: |
        Rotation, as an operation. The new secret is returned once. **The older
        secrets stay valid** until the operator revokes them, so nothing forces a
        flag day; `expire_old_in_secs` dates them if the operator wants that (a
        secret already due to stop sooner keeps its earlier date; `0` is now).
        The body may be empty. Tier A (`principal.secret_added`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrincipalId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in_secs: { type: integer, minimum: 1, description: When the new secret stops working. Default never. }
                expire_old_in_secs: { type: integer, minimum: 0, description: Date the older live secrets this far from now. Default leave them valid. }
      responses:
        "201":
          description: Added. Store the secret now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddedSecret" }
        "400":
          description: "`bad_request` or `expiry_out_of_range`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "404":
          description: "`unknown_principal`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/principals/{principal_id}/secrets/{secret_id}:
    delete:
      tags: [issuer]
      summary: Revoke one secret.
      description: Takes effect on the next request. Tier A (`principal.secret_revoked`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrincipalId" }
        - { name: secret_id, in: path, required: true, schema: { type: string, example: sps_0123456789abcdef } }
      responses:
        "204": { description: Revoked. }
        "404":
          description: "`unknown_secret`. No live secret with that id on that principal."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/user-grants:
    get:
      tags: [issuer]
      summary: List user grants.
      description: Live and revoked, at most 64.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: tenant, in: query, required: false, schema: { $ref: "#/components/schemas/Slug" } }
        - { name: sub, in: query, required: false, description: The identity provider subject, schema: { type: string } }
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserGrant" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [issuer]
      summary: Grant a person a tenant, roles and indexes.
      description: |
        What `POST /session/token` stamps into that person's tokens. A revoked
        grant is revived in place when created again; a live one is a 409. A
        tenant slug that does not exist yet is created in the same transaction.
        Tier A (`user_grant.created`).
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sub, roles]
              properties:
                sub: { type: string, minLength: 1, maxLength: 256, description: The identity provider subject. }
                tenant: { allOf: [{ $ref: "#/components/schemas/Slug" }], default: default }
                roles: { $ref: "#/components/schemas/Words" }
                indexes: { allOf: [{ $ref: "#/components/schemas/Words" }], description: 'Default `["*"]`: every index of the tenant.' }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGrant" }
        "400":
          description: "`bad_request`, `invalid_sub`, `invalid_tenant`, `invalid_roles` or `invalid_indexes`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "409":
          description: "`grant_exists` (a live grant) or `tenant_disabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/user-grants/{sub}/{tenant}:
    delete:
      tags: [issuer]
      summary: Revoke a user grant.
      description: |
        Stops new user tokens for that person on that tenant. Note that a person
        whose every grant was revoked is **not** given the single-tenant default.
        Tier A (`user_grant.revoked`).
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: sub, in: path, required: true, description: "Percent-encode it (subjects often contain `|` or `/`).", schema: { type: string } }
        - { name: tenant, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "204": { description: Revoked. }
        "404":
          description: "`unknown_grant`. No live grant for that pair."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/signing-keys:
    get:
      tags: [issuer]
      summary: List signing keys.
      description: |
        Newest first, with a state derived from the clock: `pending` (published,
        not signing yet), `signing`, `published` (older, still verifying),
        `retired` (past its end date, no longer published) or `removed`. Public
        keys only; the seed is never returned.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SigningKey" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }

  /admin/signing-keys/rotate:
    post:
      tags: [issuer]
      summary: Rotate the signing key.
      description: |
        Adds a key that starts signing after `activate_in_secs` (default a day,
        at most 30 days), so verifiers that refresh hourly have it long before a
        token carries it. The previous key stays published until the longest
        token it signed has expired plus the clock allowance.

        **`activate_in_secs: 0` is the emergency form.** The new key signs now and
        every older key is unpublished now: outstanding tokens stop verifying, and
        verifiers reject new tokens until they next refresh their key set. The
        response says so in `note`. The CLI `session-broker rotate-signing-key
        [--now]` does the same against a stopped broker. Tier A
        (`signing_key.rotated`). The body may be empty.
      security: [{ adminApiKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activate_in_secs: { type: integer, minimum: 0, maximum: 2592000 }
      responses:
        "201":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rotation" }
        "400":
          description: "`bad_request` or `activate_in_out_of_range`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "500":
          description: "`store_error`. The new key could not be stored, so nothing was rotated."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "501":
          description: "`lane_disabled`. The issuer is not configured (or its keys could not be loaded at start), or there is no admin key."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }

  /admin/audit:
    get:
      tags: [admin]
      summary: The durable audit record.
      description: |
        Read from the broker's own store, not the log pipeline (ADR-0015) — so
        it answers even when a collector is misconfigured, which is precisely
        when an audit question gets asked.

        **What is deliberately absent.** Edge authorisation (`/authz`) and
        session refresh produce no rows, on success or refusal. They change
        nothing, so they are not history; they are counters on `/metrics`. This
        is what keeps the platform's per-request path free of a store write.

        **The window is bounded** (`audit_retention_days`, default 90) and Tier-B
        events can be dropped under pressure. `rows_total`, `oldest_at` and
        `gaps` are returned on every page so an empty result can never be
        mistaken for "nothing happened": where `gaps > 0`, the absence of a row
        is not evidence of absence.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Epoch seconds, inclusive." }
        - { name: until, in: query, schema: { type: integer }, description: "Epoch seconds, inclusive." }
        - name: action
          in: query
          schema: { type: string }
          description: "Prefix match, so `key.` finds both `key.issued` and `key.revoked`."
        - { name: subject, in: query, schema: { type: string }, description: Exact match. }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: actor_kind, in: query, schema: { type: string, enum: [admin, backend, user, system, anonymous] } }
        - name: before_seq
          in: query
          schema: { type: integer }
          description: |
            Descending cursor. A `seq` cursor rather than an offset because rows
            are only ever appended and pruned — an offset would drift.
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - name: format
          in: query
          schema: { type: string, enum: [ndjson] }
          description: "`ndjson` returns one JSON object per line for export; anything else returns the envelope."
      responses:
        "200":
          description: A page of the record, plus the window it came from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
            application/x-ndjson:
              schema: { type: string }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/observability:
    get:
      tags: [admin]
      summary: What the diagnostics and audit planes are currently doing.
      description: |
        Reports configuration; it does not let you change most of it. Sinks,
        retention, redaction and the audit tiers are deployment config applied at
        restart, because a console holding the admin key must not be able to
        redirect or silence the audit stream (ADR-0015).
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Current state of both planes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Observability" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
    put:
      tags: [admin]
      summary: Raise diagnostic verbosity for a bounded window.
      description: |
        The **only** runtime-mutable part of the observability configuration, and
        the deadline is the point: a level switch with no expiry is a level
        switch that stays on, and this service logs on the platform's per-request
        path. The broker restores the configured filter itself when the window
        closes.

        Rejected before it is applied if the directive would not parse — a filter
        that failed open would log everything. Audited, because turning the
        lights down is itself a security-relevant act.
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter, duration_secs]
              properties:
                filter:
                  type: string
                  description: |
                    An `EnvFilter` directive, not merely a level —
                    `session_broker::keepalive=trace` is the shape wanted during
                    an incident.
                  example: session_broker=info,broker::authz=debug
                duration_secs:
                  type: integer
                  description: Bounded by `log_level_override_max_secs` (default 3600).
                  example: 900
      responses:
        "200":
          description: Applied, with the deadline it will restore itself at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter: { type: string }
                  expires_at: { type: integer }
        "400":
          description: "`bad_filter` — would not parse. `duration_out_of_range` — zero, or past the ceiling."
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501":
          description: "`no_log_control` — this process did not install its own subscriber."
    delete:
      tags: [admin]
      summary: Restore the configured filter now.
      description: Idempotent — restoring when nothing is overridden is a no-op, not an error.
      security: [{ adminApiKey: [] }]
      responses:
        "204": { description: "Restored, or there was nothing to restore." }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe (internal lane).
      description: |
        Ready to take traffic, as opposed to `/healthz` (public lane), which says
        only that the process is up. `200` requires all three of: shutdown has
        not begun, the store writer thread is still receiving, and the read
        connection answers a query. Otherwise `503` with the same body, so the
        orchestrator can route around a broker that would accept logins it
        cannot persist.

        On SIGTERM this flips to `503` first and the listeners close
        `shutdown_drain_delay_secs` later. Unauthenticated, by the same decision
        as `/metrics`.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready (draining, or the store is unhealthy).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus text exposition (internal lane).
      description: |
        **Unauthenticated, by decision.** Scrape configs manage bearer tokens
        badly and a silently-rotated one breaks the monitoring that would have
        told you it broke. The listener's network position is the control — the
        same posture that already guards `/internal/token` next door, which is a
        far larger problem if this listener is reachable from somewhere it should
        not be.

        Carries counts and latencies only: no `sub`, no `sid`, and route labels
        are matched axum patterns rather than raw paths (INV-12).

        Absent entirely when `metrics_enabled=false`.
      responses:
        "200":
          description: Prometheus text format 0.0.4.
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-broker_session
      description: "`HttpOnly`. Sent automatically on same-origin requests; script can never read it."
    brokerApiKey:
      type: http
      scheme: bearer
      description: |
        A backend API key — issued via `/admin/api-keys`, or the bootstrap key
        from config. Required IN ADDITION to a session token; neither alone is
        sufficient.
    adminApiKey:
      type: http
      scheme: bearer
      description: |
        The admin key. Deliberately a DIFFERENT value from the backend key: one
        that can mint keys is strictly more powerful than one that exchanges a
        session for a token, and sharing them would let every backend service
        issue credentials for itself.

    principalSecret:
      type: http
      scheme: basic
      description: |
        A service principal's id and secret (`sp_…` : `sbp_…`), accepted ONLY by
        `POST /auth/token`. The same pair may instead be sent as `client_id` and
        `client_secret` form fields. It opens nothing else: not `/internal/token`,
        not `/authz`, not `/admin/*`.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of the caller's copy. A match gives 304 and no body.
      schema: { type: string }
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema: { type: string, example: sp_a1b2c3d4e5f6g7h8 }

  responses:
    AdminUnauthorised:
      description: "`unauthorised` — a valid admin API key is required."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaneError" }
    AdminDisabled:
      description: "`lane_disabled` — no `admin_api_key` is configured, so the lane is off. Unconfigured means closed, not open."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaneError" }

  schemas:
    Readiness:
      type: object
      required: [ready, draining, writer, store]
      properties:
        ready: { type: boolean }
        draining: { type: boolean }
        writer: { type: boolean, description: The store writer thread is receiving. }
        store: { type: boolean, description: The read connection answered a query. }
    SessionMeta:
      type: object
      description: |
        Also the decoded content of the `broker_meta` cookie. Non-secret by
        construction and unsigned on purpose (INV-9) — the server never reads it
        back, so nothing here is a basis for a decision.
      required: [v, sub, sid, gen, active_until, refresh_until, absolute_until, custody]
      properties:
        v: { type: integer, const: 1 }
        sub: { type: string }
        sid: { type: string }
        gen: { type: integer, description: Generation number; increments on each rotation. }
        active_until: { type: integer, description: Unix seconds — when this generation stops authenticating. }
        refresh_until: { type: integer, description: Idle expiry; slides on use. }
        absolute_until: { type: integer, description: Hard ceiling; never slides. }
        custody:
          type: string
          enum: [ok, degraded, dead]
          description: Health of the upstream grant behind this session.

    ApiKey:
      type: object
      required: [key_id, name, created_at, live]
      properties:
        key_id: { type: string }
        name: { type: string }
        created_at: { type: integer }
        created_by: { type: [string, "null"] }
        last_used_at: { type: [integer, "null"] }
        revoked_at: { type: [integer, "null"] }
        live:
          type: boolean
          description: Derived from `revoked_at`, so the console and the token lane cannot disagree about what "live" means.

    AdminSession:
      type: object
      required: [sid, sub, custody_id, current_gen, idle_exp, absolute_exp]
      properties:
        sid: { type: string }
        sub: { type: string }
        custody_id: { type: string }
        current_gen: { type: integer }
        idle_exp: { type: integer }
        absolute_exp: { type: integer }

    Custody:
      type: object
      required: [custody_id, status, access_exp, next_refresh, fail_count]
      properties:
        custody_id: { type: string }
        status: { type: string, enum: [ok, degraded, dead] }
        access_exp: { type: integer }
        next_refresh: { type: integer }
        fail_count: { type: integer }

    AuditRow:
      type: object
      description: |
        One immutable row. `seq` is `AUTOINCREMENT` and never reused, even after
        a retention prune — so it is a stable cursor AND a gap in it reads as
        evidence rather than ambiguity.
      required: [seq, at, action, outcome, actor_kind]
      properties:
        seq: { type: integer }
        at: { type: integer, description: Epoch seconds. }
        action:
          type: string
          description: |
            Stable dotted name. Catalogue in
            `docs/architecture/observability.md` §4.
          example: key.issued
        outcome: { type: string, enum: [success, failure] }
        actor_kind: { type: string, enum: [admin, backend, user, system, anonymous] }
        actor_id: { type: [string, "null"], description: "A `key_id`, a subject, or null." }
        subject: { type: [string, "null"], description: Whose data was acted on. }
        sid: { type: [string, "null"] }
        custody_id: { type: [string, "null"] }
        key_id: { type: [string, "null"] }
        reason: { type: [string, "null"], description: "The refusal code, on failure." }
        client_ip_prefix:
          type: [string, "null"]
          description: A /24 or /48 prefix. Never a full address (INV-12).
          example: 203.0.113.0/24
        detail:
          type: [object, "null"]
          description: Non-secret structured context.

    AuditPage:
      type: object
      required: [rows, retention_days, rows_total, gaps]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AuditRow" }
        next_before_seq:
          type: [integer, "null"]
          description: Cursor for the next page; null at the end.
        retention_days: { type: integer, description: "0 means rows are kept forever." }
        rows_total: { type: integer }
        oldest_at:
          type: [integer, "null"]
          description: |
            Null when the table is empty — which is how a client tells "no
            history yet" from "history since 1970".
        newest_at: { type: [integer, "null"] }
        gaps:
          type: integer
          description: |
            `audit.gap` rows in the window. NONZERO means events were dropped at
            the queue bound, and for the periods those markers cover the absence
            of a row is not evidence of absence.

    Observability:
      type: object
      description: |
        Everything reported here is deployment config except
        `effective_filter`/`override_*`, which is the one runtime-mutable part.
      properties:
        log_format: { type: string, enum: [text, json, unknown] }
        configured_filter: { type: string }
        effective_filter: { type: string, description: Differs from configured while an override is in force. }
        sinks: { type: array, items: { type: string } }
        log_file: { type: [string, "null"] }
        log_file_rotation:
          type: [string, "null"]
          description: |
            Rotation only. The broker never deletes a file it has closed —
            pruning is logrotate's job or the volume's.
        override_active: { type: boolean }
        override_expires_at: { type: [integer, "null"] }
        override_requested_by: { type: [string, "null"] }
        override_max_secs: { type: integer }
        metrics_path: { type: [string, "null"] }
        audit_retention_days: { type: integer }
        audit_queue_capacity: { type: integer }
        audit_queue_depth: { type: integer }
        audit_coalesce_secs: { type: integer }
        audit_subject_mode: { type: string, enum: [plain, hashed] }
        audit_record_rotations: { type: boolean }
        audit_rows: { type: integer }
        audit_oldest_at: { type: [integer, "null"] }
        audit_newest_at: { type: [integer, "null"] }
        audit_gaps: { type: integer }
        audit_dropped_total:
          type: integer
          description: Since boot. Alert on any increase — the record has a hole.
        audit_failed_total:
          type: integer
          description: Tier-A writes that failed, each of which refused an admin operation.

    ApiError:
      type: object
      description: The public lane's error shape.
      properties:
        error: { type: string, description: A stable machine-readable code. Clients branch on this. }
        detail: { type: string }
        login_url:
          type: [string, "null"]
          description: Where to send the browser to re-authenticate, so the SDK never builds one itself.

    LaneError:
      type: object
      description: The internal and admin lanes' error shape.
      required: [error, detail]
      properties:
        error:
          type: string
          description: A stable machine-readable code. Clients should branch on this, not on the status alone.
        detail: { type: string }

    Slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      example: acme

    Words:
      type: array
      minItems: 1
      maxItems: 64
      items: { type: string, minLength: 1, maxLength: 128, pattern: '^\S+$' }
      description: Each item 1 to 128 characters, no whitespace or control characters.

    TokenResponse:
      type: object
      description: RFC 6749 section 5.1.
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: |
            A compact JWS. Header `{"alg":"EdDSA","typ":"JWT","kid"}`. Claims, in
            this order: `iss`, `sub` (the principal id), `aud` (one string), `exp`,
            `iat`, `jti`, `tenant`, `kind`, `name`, `scopes`, `indexes`. No `nbf`.
            See `docs/verifier/README.md`.
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: "Seconds. Default is the issuer's machine lifetime, lowered to the principal's maximum." }
        scope: { type: string, description: "The granted scopes, space-separated." }

    UserTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, tenant, roles, indexes]
      properties:
        access_token:
          type: string
          description: |
            A compact JWS. Header `{"alg":"EdDSA","typ":"JWT","kid"}`. Claims, in
            this order: `iss`, `sub` (the identity provider subject), `sid` (the
            broker session id), `aud`, `exp`, `iat`, `jti`, `kind` (`user`),
            `tenant`, `roles`, `indexes`. See `docs/verifier/README.md`.
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        tenant: { type: string }
        roles: { type: array, items: { type: string } }
        indexes: { type: array, items: { type: string } }

    OAuthError:
      type: object
      description: RFC 6749 section 5.2. `/auth/token` uses this shape rather than the broker's own, so OAuth client libraries understand it.
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unsupported_grant_type
            - invalid_client
            - invalid_scope
            - unauthorized_client
            - rate_limited
            - temporarily_unavailable
        error_description: { type: string }

    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, kid, x, use, alg]
            properties:
              kty: { type: string, const: OKP }
              crv: { type: string, const: Ed25519 }
              kid: { type: string, description: "base64url(SHA-256(public key)[..8]), 11 characters." }
              x: { type: string, description: "The public key, base64url." }
              use: { type: string, const: sig }
              alg: { type: string, const: EdDSA }

    IssuerMetadata:
      type: object
      description: RFC 8414, with only what exists.
      required: [issuer, jwks_uri, token_endpoint, grant_types_supported, token_endpoint_auth_methods_supported, response_types_supported]
      properties:
        issuer: { type: string, description: The configured `token_issuer`; the `iss` of every token. }
        jwks_uri: { type: string }
        token_endpoint: { type: string }
        grant_types_supported: { type: array, items: { type: string }, example: [client_credentials] }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string }, example: [client_secret_post, client_secret_basic] }
        response_types_supported: { type: array, items: { type: string }, example: [token] }

    Tenant:
      type: object
      required: [tenant, created_at, live]
      properties:
        tenant: { $ref: "#/components/schemas/Slug" }
        display_name: { type: [string, "null"] }
        created_at: { type: integer }
        disabled_at: { type: [integer, "null"] }
        live: { type: boolean, description: Derived from `disabled_at`. }

    NewPrincipal:
      type: object
      additionalProperties: false
      required: [name, kind, scopes, audience]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: "Unique within the tenant, and reserved for good: a revoked principal keeps its name." }
        tenant: { allOf: [{ $ref: "#/components/schemas/Slug" }], default: default }
        kind: { type: string, enum: [ingest, node, replica, reader, admin] }
        scopes: { $ref: "#/components/schemas/Words" }
        indexes: { allOf: [{ $ref: "#/components/schemas/Words" }], description: 'Default `["*"]`: every index of the tenant.' }
        audience: { type: string, minLength: 1, maxLength: 128, example: logless }
        max_ttl_secs:
          type: integer
          minimum: 1
          maximum: 31536000
          default: 2592000
          description: The longest token lifetime this principal may ask for (the issuer's own maximum also applies).
        expires_in_secs: { type: integer, minimum: 1, description: When the first secret stops working. Default never. }

    Principal:
      type: object
      required: [principal_id, tenant, name, kind, scopes, indexes, audience, max_ttl_secs, created_at, live]
      properties:
        principal_id: { type: string, example: sp_a1b2c3d4e5f6g7h8 }
        tenant: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ingest, node, replica, reader, admin] }
        scopes: { type: array, items: { type: string } }
        indexes: { type: array, items: { type: string } }
        audience: { type: string }
        max_ttl_secs: { type: integer }
        created_at: { type: integer }
        created_by: { type: [string, "null"] }
        last_used_at: { type: [integer, "null"], description: "Written at most once a minute per principal. Answers: is anything still using this, before an operator revokes?" }
        revoked_at: { type: [integer, "null"] }
        live: { type: boolean, description: Derived from `revoked_at`. }

    PrincipalSecret:
      type: object
      required: [secret_id, created_at, live]
      properties:
        secret_id: { type: string, example: sps_0123456789abcdef }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"], description: Null means it does not expire. }
        revoked_at: { type: [integer, "null"] }
        live: { type: boolean, description: Not revoked and not past `expires_at`. }

    PrincipalDetail:
      allOf:
        - $ref: "#/components/schemas/Principal"
        - type: object
          required: [secrets]
          properties:
            secrets:
              type: array
              items: { $ref: "#/components/schemas/PrincipalSecret" }

    IssuedSecret:
      type: object
      required: [secret_id, secret, created_at]
      properties:
        secret_id: { type: string }
        secret: { type: string, example: sbp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx, description: "`sbp_` plus 32 random bytes, base64url. Shown once. Not recoverable." }
        created_at: { type: integer }
        expires_at: { type: [integer, "null"] }

    CreatedPrincipal:
      allOf:
        - $ref: "#/components/schemas/Principal"
        - type: object
          required: [secret]
          properties:
            secret: { $ref: "#/components/schemas/IssuedSecret" }

    AddedSecret:
      allOf:
        - $ref: "#/components/schemas/IssuedSecret"
        - type: object
          required: [principal_id]
          properties:
            principal_id: { type: string }
            old_secrets_expire_at: { type: [integer, "null"], description: "When the older secrets stop working, if the request asked for that." }

    UserGrant:
      type: object
      required: [sub, tenant, roles, indexes, created_at, live]
      properties:
        sub: { type: string }
        tenant: { type: string }
        roles: { type: array, items: { type: string } }
        indexes: { type: array, items: { type: string } }
        created_at: { type: integer }
        created_by: { type: [string, "null"] }
        revoked_at: { type: [integer, "null"] }
        live: { type: boolean }

    SigningKey:
      type: object
      required: [kid, x, created_at, activate_at, state]
      properties:
        kid: { type: string }
        x: { type: string, description: "The public key, base64url, as published in the JWK Set. Never the seed." }
        created_at: { type: integer }
        activate_at: { type: integer, description: When it starts signing. }
        retire_at: { type: [integer, "null"], description: When it stops being published. Null means open-ended. }
        removed_at: { type: [integer, "null"] }
        state: { type: string, enum: [pending, signing, published, retired, removed] }

    Rotation:
      type: object
      required: [kid, activate_at, previous_retire_at, immediate, note]
      properties:
        kid: { type: string, description: The new key. }
        activate_at: { type: integer }
        previous_retire_at: { type: integer, description: When the keys before it stop being published. }
        immediate: { type: boolean, description: True for a zero-lead rotation. }
        note: { type: string, description: "What the operator should expect to happen next, in words." }

security:
  - sessionCookie: []
