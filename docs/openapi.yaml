openapi: 3.1.0

# The session-broker HTTP contract.
#
# Hand-written rather than generated. The endpoints are few and stable, and the
# thing worth documenting here is not the shapes — it is which LISTENER each
# endpoint is on and what each refusal means, neither of which a code generator
# would infer. Keep this in step with `docs/architecture/implementation-strategy.md` §4.
#
# THREE LANES, TWO LISTENERS:
#
#   public   (bind_addr)          /auth/*, /session*, /logout   — the browser
#   internal (internal_bind_addr) /internal/token               — backend services
#   internal (internal_bind_addr) /admin/*                      — operators/console
#
# The internal listener must not be internet-reachable. Both lanes on it still
# require authentication regardless, because a bind address is a deployment
# promise rather than an enforced invariant.

info:
  title: session-broker
  version: 0.1.0
  summary: Brokers browser sessions against an upstream OIDC provider and takes custody of the upstream tokens.
  description: |
    Three properties define the service, in priority order:

    1. **Non-invalidating rotation.** Issuing a new session cookie does not
       invalidate the previous one; generations overlap for a grace window.
       This removes the refresh race class outright rather than coordinating
       around it.
    2. **Local-only fast refresh.** Session lifetime is decoupled from upstream
       token lifetime. `POST /session/refresh` performs no network I/O (INV-8).
    3. **Server-side guarantees, dumb client.** The browser SDK needs no
       cross-tab coordination beyond one Web Lock.

    ## Cookies

    - `__Host-broker_session` (`broker_session` over loopback) — `HttpOnly`,
      `SameSite=Lax`. The credential. Never readable by script.
    - `broker_meta` — deliberately readable by script (INV-9), and deliberately
      **unsigned**. It is a client hint. The server never reads it back, and
      signing it would imply it could be trusted as input.

    ## CSRF

    Same-origin path-mounted deployment is the default (INV-10, ADR-0012), so
    there is no CORS surface. The CSRF boundary is `Sec-Fetch-Site` / `Origin`
    on unsafe methods (ADR-0004), which the browser sets and script cannot forge.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: https://app.example.com
    description: Public lane, path-mounted on the SPA's own origin (ADR-0012).
  - url: http://127.0.0.1:8090
    description: Internal lane — token exchange and admin. Not internet-reachable.

tags:
  - name: auth
    description: OAuth2/OIDC authorization-code entry path (public lane).
  - name: session
    description: Session lifecycle (public lane). No network I/O on the hot path.
  - name: internal
    description: Backend token exchange (internal lane, dual authentication).
  - name: admin
    description: Key, session and custody management (internal lane).
  - name: ops
    description: |
      Observability (internal lane). Two planes with different promises:
      diagnostics are lossy and shipped by the deployment, the audit record is
      durable and queryable here. See ADR-0014 and ADR-0015.

paths:
  /healthz:
    get:
      tags: [session]
      summary: Liveness. Present on BOTH listeners.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema: { type: string, example: ok }

  /auth/login:
    get:
      tags: [auth]
      summary: Begin a login.
      description: |
        Starts a server-side login transaction (INV-3) — `state`, PKCE verifier
        and `nonce` are stored server-side and the browser receives only an
        opaque txn id in `__Host-broker_txn` — then redirects to the IdP.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: |
            Where to land after a successful callback. Must be a **same-origin
            absolute path** (INV-4). Anything else is rejected outright rather
            than silently downgraded: nothing has been created yet, so there is
            nothing to protect by continuing.
          schema: { type: string, example: /dashboard }
      responses:
        "303":
          description: Redirect to the IdP's authorization endpoint.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie:
              description: "`__Host-broker_txn`, `HttpOnly`, `Max-Age=600`."
              schema: { type: string }
        "400":
          description: "`return_to` was not a same-origin absolute path."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /auth/callback:
    get:
      tags: [auth]
      summary: Redeem the authorization code and mint a session.
      description: |
        The txn is consumed on FIRST TOUCH, success or failure alike (INV-3c),
        so a replayed callback finds nothing.

        Every failure — missing txn cookie, `state` mismatch, expired txn, failed
        exchange, bad `id_token`, or custody that could not be persisted — lands
        on the error page and creates **no session**. There is no partial success:
        a session without a durable upstream grant would appear to work and be
        unable to do anything.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: The IdP-reported-error form. }
      responses:
        "303":
          description: |
            On success, redirect to the txn's stored `return_to` with the session
            and meta cookies set. On any failure, redirect to
            `/error?error=oauth_error` with no session.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }

  /session:
    get:
      tags: [session]
      summary: The current session's meta.
      description: Read-only. Answers from memory; performs no I/O.
      responses:
        "200":
          description: A live session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "401":
          description: No session, or one that no longer authenticates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /session/refresh:
    post:
      tags: [session]
      summary: Rotate (or coalesce onto) the current generation.
      description: |
        **Performs no network I/O** (INV-8) — it never calls the IdP. Refreshes
        arriving within the coalesce window re-issue the current generation
        rather than minting, so N concurrent refreshes mint exactly once.

        Rotation is non-invalidating: the previous cookie stays valid for the
        grace window, which is why a client needs no cross-tab coordination.
      responses:
        "200":
          description: Session refreshed. Both cookies re-issued.
          headers:
            Set-Cookie: { schema: { type: string } }
            X-Broker-Handler-Us:
              description: Server-side handler time in microseconds, for the demo's RTT panel.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMeta" }
        "401":
          description: Unknown token, a retired generation, or an expired session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: The CSRF boundary refused this request (ADR-0004).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    get:
      tags: [session]
      summary: Interactive refresh — a browser navigation, not a fetch.
      parameters:
        - { name: interactive, in: query, schema: { type: string, enum: ["1"] } }
        - { name: return_to, in: query, schema: { type: string } }
      responses:
        "303":
          description: Redirect back to `return_to`, or to login if the session is gone.

  /logout:
    post:
      tags: [session]
      summary: End the session everywhere.
      description: |
        One tombstone kills every generation at once (INV-7, ADR-0010). Clearing
        an already-expired session still succeeds — logout must never fail.
      responses:
        "204":
          description: Session ended; both cookies expired.
          headers:
            Set-Cookie: { schema: { type: string } }

  /internal/token:
    post:
      tags: [internal]
      summary: Exchange a session token for the custodied upstream access token.
      description: |
        **Dual authentication, and neither half is sufficient** (INV-11, ADR-0007):

        - a broker API key proves the caller is a trusted backend — on its own it
          cannot name a user;
        - a live session token proves *which* user — on its own it yields nothing,
          which is what stops a cookie stolen by XSS from being exchanged, since
          the browser does not hold the key.

        **No inline refresh.** If the custodied access token has expired this
        answers `custody_unavailable` rather than calling the IdP (INV-8): a
        backend seeing it should retry, not treat it as an auth failure.

        Two kinds of key work here. Keys **issued** through `/admin/api-keys` are
        the normal case and can be revoked without a restart. The single
        **bootstrap** key from config exists so the first issued key can be
        created, and cannot be revoked without a deploy.
      security:
        - brokerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token:
                  type: string
                  description: The raw session cookie value, forwarded by the backend.
      responses:
        "200":
          description: The current upstream access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, sub, expires_at]
                properties:
                  access_token: { type: string }
                  sub:
                    type: string
                    description: The IdP subject. Opaque — map it to your own user model.
                  expires_at: { type: integer, description: Unix seconds. }
                  scope: { type: [string, "null"] }
        "401":
          description: |
            `missing_api_key` / `bad_api_key` — the CALLER's credential is wrong;
            an operator problem, not the user's.
            `session_not_active` — the session does not authenticate resource access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "501":
          description: "`lane_disabled` — no broker API keys are configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "503":
          description: |
            `upstream_revoked` — the grant behind this session is dead.
            `custody_unavailable` — the access token has expired and has not yet
            been renewed by the keepalive worker. **Retry; do not log the user out.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }

  /admin/api-keys:
    get:
      tags: [admin]
      summary: List backend API keys.
      description: |
        Live and revoked, newest first. Revoked keys are kept rather than deleted
        — "this key was revoked last Tuesday" is the answer an incident review
        needs. **Secrets are never returned.**
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501": { $ref: "#/components/responses/AdminDisabled" }
    post:
      tags: [admin]
      summary: Issue a new backend API key.
      description: |
        **The secret is returned exactly once, here.** Only its SHA-256 is
        stored, and no endpoint reveals it afterwards — a leaked console database
        should expose *who holds access*, not the access itself. Losing a key
        means issuing a new one.
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Which backend this key is for. Five keys named "key" answer nothing during an incident.
      responses:
        "201":
          description: Key issued. Store the secret now; it cannot be retrieved again.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, name, secret, created_at]
                properties:
                  key_id: { type: string, example: bk_9f3a2c1b7d4e6f80 }
                  name: { type: string }
                  secret: { type: string, description: Shown once. Not recoverable. }
                  created_at: { type: integer }
        "400":
          description: "`name_required`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/api-keys/{key_id}:
    delete:
      tags: [admin]
      summary: Revoke a key.
      description: |
        Takes effect on the next request — there is no cache to wait out and no
        restart required, which is what makes this meaningful rather than
        advisory.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: key_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "404":
          description: |
            `unknown_key` — no LIVE key with that id. Reported rather than
            swallowed: "revoked" and "there was nothing to revoke" must not look
            alike to someone racing to cut off access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaneError" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/sessions:
    get:
      tags: [admin]
      summary: List live sessions.
      description: |
        Read from the store, not the in-memory map: the map holds token hashes,
        and an admin surface has no business near credential material even in
        hashed form.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Live sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/sessions/{sid}:
    delete:
      tags: [admin]
      summary: Force-logout a session.
      description: Kills every generation at once (INV-7), in memory and durably.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/custody:
    get:
      tags: [admin]
      summary: Upstream grant health.
      description: |
        Excludes `dead` custodies, whose grant will never work again. A session
        can be perfectly valid while the token behind it is degraded — this is
        where that shows.
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Custody schedule and health.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Custody" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/audit:
    get:
      tags: [admin]
      summary: The durable audit record.
      description: |
        Read from the broker's own store, not the log pipeline (ADR-0015) — so
        it answers even when a collector is misconfigured, which is precisely
        when an audit question gets asked.

        **What is deliberately absent.** Edge authorisation (`/authz`) and
        session refresh produce no rows, on success or refusal. They change
        nothing, so they are not history; they are counters on `/metrics`. This
        is what keeps the platform's per-request path free of a store write.

        **The window is bounded** (`audit_retention_days`, default 90) and Tier-B
        events can be dropped under pressure. `rows_total`, `oldest_at` and
        `gaps` are returned on every page so an empty result can never be
        mistaken for "nothing happened": where `gaps > 0`, the absence of a row
        is not evidence of absence.
      security: [{ adminApiKey: [] }]
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: "Epoch seconds, inclusive." }
        - { name: until, in: query, schema: { type: integer }, description: "Epoch seconds, inclusive." }
        - name: action
          in: query
          schema: { type: string }
          description: "Prefix match, so `key.` finds both `key.issued` and `key.revoked`."
        - { name: subject, in: query, schema: { type: string }, description: Exact match. }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: actor_kind, in: query, schema: { type: string, enum: [admin, backend, user, system, anonymous] } }
        - name: before_seq
          in: query
          schema: { type: integer }
          description: |
            Descending cursor. A `seq` cursor rather than an offset because rows
            are only ever appended and pruned — an offset would drift.
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - name: format
          in: query
          schema: { type: string, enum: [ndjson] }
          description: "`ndjson` returns one JSON object per line for export; anything else returns the envelope."
      responses:
        "200":
          description: A page of the record, plus the window it came from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
            application/x-ndjson:
              schema: { type: string }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /admin/observability:
    get:
      tags: [admin]
      summary: What the diagnostics and audit planes are currently doing.
      description: |
        Reports configuration; it does not let you change most of it. Sinks,
        retention, redaction and the audit tiers are deployment config applied at
        restart, because a console holding the admin key must not be able to
        redirect or silence the audit stream (ADR-0015).
      security: [{ adminApiKey: [] }]
      responses:
        "200":
          description: Current state of both planes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Observability" }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
    put:
      tags: [admin]
      summary: Raise diagnostic verbosity for a bounded window.
      description: |
        The **only** runtime-mutable part of the observability configuration, and
        the deadline is the point: a level switch with no expiry is a level
        switch that stays on, and this service logs on the platform's per-request
        path. The broker restores the configured filter itself when the window
        closes.

        Rejected before it is applied if the directive would not parse — a filter
        that failed open would log everything. Audited, because turning the
        lights down is itself a security-relevant act.
      security: [{ adminApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter, duration_secs]
              properties:
                filter:
                  type: string
                  description: |
                    An `EnvFilter` directive, not merely a level —
                    `session_broker::keepalive=trace` is the shape wanted during
                    an incident.
                  example: session_broker=info,broker::authz=debug
                duration_secs:
                  type: integer
                  description: Bounded by `log_level_override_max_secs` (default 3600).
                  example: 900
      responses:
        "200":
          description: Applied, with the deadline it will restore itself at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filter: { type: string }
                  expires_at: { type: integer }
        "400":
          description: "`bad_filter` — would not parse. `duration_out_of_range` — zero, or past the ceiling."
        "401": { $ref: "#/components/responses/AdminUnauthorised" }
        "501":
          description: "`no_log_control` — this process did not install its own subscriber."
    delete:
      tags: [admin]
      summary: Restore the configured filter now.
      description: Idempotent — restoring when nothing is overridden is a no-op, not an error.
      security: [{ adminApiKey: [] }]
      responses:
        "204": { description: "Restored, or there was nothing to restore." }
        "401": { $ref: "#/components/responses/AdminUnauthorised" }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus text exposition (internal lane).
      description: |
        **Unauthenticated, by decision.** Scrape configs manage bearer tokens
        badly and a silently-rotated one breaks the monitoring that would have
        told you it broke. The listener's network position is the control — the
        same posture that already guards `/internal/token` next door, which is a
        far larger problem if this listener is reachable from somewhere it should
        not be.

        Carries counts and latencies only: no `sub`, no `sid`, and route labels
        are matched axum patterns rather than raw paths (INV-12).

        Absent entirely when `metrics_enabled=false`.
      responses:
        "200":
          description: Prometheus text format 0.0.4.
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-broker_session
      description: "`HttpOnly`. Sent automatically on same-origin requests; script can never read it."
    brokerApiKey:
      type: http
      scheme: bearer
      description: |
        A backend API key — issued via `/admin/api-keys`, or the bootstrap key
        from config. Required IN ADDITION to a session token; neither alone is
        sufficient.
    adminApiKey:
      type: http
      scheme: bearer
      description: |
        The admin key. Deliberately a DIFFERENT value from the backend key: one
        that can mint keys is strictly more powerful than one that exchanges a
        session for a token, and sharing them would let every backend service
        issue credentials for itself.

  responses:
    AdminUnauthorised:
      description: "`unauthorised` — a valid admin API key is required."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaneError" }
    AdminDisabled:
      description: "`lane_disabled` — no `admin_api_key` is configured, so the lane is off. Unconfigured means closed, not open."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaneError" }

  schemas:
    SessionMeta:
      type: object
      description: |
        Also the decoded content of the `broker_meta` cookie. Non-secret by
        construction and unsigned on purpose (INV-9) — the server never reads it
        back, so nothing here is a basis for a decision.
      required: [v, sub, sid, gen, active_until, refresh_until, absolute_until, custody]
      properties:
        v: { type: integer, const: 1 }
        sub: { type: string }
        sid: { type: string }
        gen: { type: integer, description: Generation number; increments on each rotation. }
        active_until: { type: integer, description: Unix seconds — when this generation stops authenticating. }
        refresh_until: { type: integer, description: Idle expiry; slides on use. }
        absolute_until: { type: integer, description: Hard ceiling; never slides. }
        custody:
          type: string
          enum: [ok, degraded, dead]
          description: Health of the upstream grant behind this session.

    ApiKey:
      type: object
      required: [key_id, name, created_at, live]
      properties:
        key_id: { type: string }
        name: { type: string }
        created_at: { type: integer }
        created_by: { type: [string, "null"] }
        last_used_at: { type: [integer, "null"] }
        revoked_at: { type: [integer, "null"] }
        live:
          type: boolean
          description: Derived from `revoked_at`, so the console and the token lane cannot disagree about what "live" means.

    AdminSession:
      type: object
      required: [sid, sub, custody_id, current_gen, idle_exp, absolute_exp]
      properties:
        sid: { type: string }
        sub: { type: string }
        custody_id: { type: string }
        current_gen: { type: integer }
        idle_exp: { type: integer }
        absolute_exp: { type: integer }

    Custody:
      type: object
      required: [custody_id, status, access_exp, next_refresh, fail_count]
      properties:
        custody_id: { type: string }
        status: { type: string, enum: [ok, degraded, dead] }
        access_exp: { type: integer }
        next_refresh: { type: integer }
        fail_count: { type: integer }

    AuditRow:
      type: object
      description: |
        One immutable row. `seq` is `AUTOINCREMENT` and never reused, even after
        a retention prune — so it is a stable cursor AND a gap in it reads as
        evidence rather than ambiguity.
      required: [seq, at, action, outcome, actor_kind]
      properties:
        seq: { type: integer }
        at: { type: integer, description: Epoch seconds. }
        action:
          type: string
          description: |
            Stable dotted name. Catalogue in
            `docs/architecture/observability.md` §4.
          example: key.issued
        outcome: { type: string, enum: [success, failure] }
        actor_kind: { type: string, enum: [admin, backend, user, system, anonymous] }
        actor_id: { type: [string, "null"], description: "A `key_id`, a subject, or null." }
        subject: { type: [string, "null"], description: Whose data was acted on. }
        sid: { type: [string, "null"] }
        custody_id: { type: [string, "null"] }
        key_id: { type: [string, "null"] }
        reason: { type: [string, "null"], description: "The refusal code, on failure." }
        client_ip_prefix:
          type: [string, "null"]
          description: A /24 or /48 prefix. Never a full address (INV-12).
          example: 203.0.113.0/24
        detail:
          type: [object, "null"]
          description: Non-secret structured context.

    AuditPage:
      type: object
      required: [rows, retention_days, rows_total, gaps]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AuditRow" }
        next_before_seq:
          type: [integer, "null"]
          description: Cursor for the next page; null at the end.
        retention_days: { type: integer, description: "0 means rows are kept forever." }
        rows_total: { type: integer }
        oldest_at:
          type: [integer, "null"]
          description: |
            Null when the table is empty — which is how a client tells "no
            history yet" from "history since 1970".
        newest_at: { type: [integer, "null"] }
        gaps:
          type: integer
          description: |
            `audit.gap` rows in the window. NONZERO means events were dropped at
            the queue bound, and for the periods those markers cover the absence
            of a row is not evidence of absence.

    Observability:
      type: object
      description: |
        Everything reported here is deployment config except
        `effective_filter`/`override_*`, which is the one runtime-mutable part.
      properties:
        log_format: { type: string, enum: [text, json, unknown] }
        configured_filter: { type: string }
        effective_filter: { type: string, description: Differs from configured while an override is in force. }
        sinks: { type: array, items: { type: string } }
        log_file: { type: [string, "null"] }
        log_file_rotation:
          type: [string, "null"]
          description: |
            Rotation only. The broker never deletes a file it has closed —
            pruning is logrotate's job or the volume's.
        override_active: { type: boolean }
        override_expires_at: { type: [integer, "null"] }
        override_requested_by: { type: [string, "null"] }
        override_max_secs: { type: integer }
        metrics_path: { type: [string, "null"] }
        audit_retention_days: { type: integer }
        audit_queue_capacity: { type: integer }
        audit_queue_depth: { type: integer }
        audit_coalesce_secs: { type: integer }
        audit_subject_mode: { type: string, enum: [plain, hashed] }
        audit_record_rotations: { type: boolean }
        audit_rows: { type: integer }
        audit_oldest_at: { type: [integer, "null"] }
        audit_newest_at: { type: [integer, "null"] }
        audit_gaps: { type: integer }
        audit_dropped_total:
          type: integer
          description: Since boot. Alert on any increase — the record has a hole.
        audit_failed_total:
          type: integer
          description: Tier-A writes that failed, each of which refused an admin operation.

    ApiError:
      type: object
      description: The public lane's error shape.
      properties:
        code: { type: string }
        message: { type: string }
        login_url:
          type: [string, "null"]
          description: Where to send the browser to re-authenticate, so the SDK never builds one itself.

    LaneError:
      type: object
      description: The internal and admin lanes' error shape.
      required: [error, detail]
      properties:
        error:
          type: string
          description: A stable machine-readable code. Clients should branch on this, not on the status alone.
        detail: { type: string }

security:
  - sessionCookie: []
