[package]
name = "mock-idp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "In-process mock OpenID Connect provider used as a test fixture for session-broker."
publish = false

[[bin]]
name = "mock-idp"
path = "src/main.rs"

[lib]
name = "mock_idp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
# Pinned to 0.8 rather than the workspace's 0.10, deliberately.
#
# `rsa` still uses rand_core 0.6, and its key generation takes an RNG from that
# generation — so a 0.10 RNG does not satisfy the bound. Pinning here rather
# than holding the whole workspace back keeps the BROKER on current `rand`,
# which is where it matters: this crate is a dev-dependency test fixture and is
# excluded from every release artifact, so the older RNG never ships.
#
# Revisit when `rsa` moves to rand_core 0.9+.
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
# Not in the workspace [workspace.dependencies] table: needed to generate the
# id_token RS256 keypair (seeded, in-process). See crate README/report — the
# workspace table has jsonwebtoken for *signing* but nothing for *generating*
# RSA key material, and pulling in a whole KMS/openssl story for a disposable
# test-fixture keypair would be overkill.
rsa = { version = "0.9.10", features = ["sha2"] }

[dev-dependencies]
reqwest.workspace = true
tower.workspace = true
