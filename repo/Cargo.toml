[workspace]
members = [
    "crates/mock-idp",
    "crates/session-broker",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# Kept in step with security/iam and security/secrets-keeper so the three
# security services share one dependency posture.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.23"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
jsonwebtoken = "9.3.1"
openidconnect = "4.0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
proptest = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.13"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
# `json` is the collector-facing format. `tracing_subscriber::reload` — what
# makes the console's bounded temporary-verbosity control possible without a
# restart (ADR-0014) — needs no feature flag; it is always compiled in.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Taken for `non_blocking` — a bounded queue drained by a dedicated thread — not
# for file rotation. A `tracing::info!` on the /authz path must never perform a
# write(2), and a full stdout pipe must never become backpressure on the
# platform's per-request path (ADR-0014).
tracing-appender = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
