# Dependency updates.
#
# Grouped rather than one PR per crate: this repo has ~320 transitive
# dependencies, and a review queue of forty single-bump PRs is a queue nobody
# reads — which is the failure mode Dependabot is supposed to prevent. Security
# updates are deliberately left ungrouped so they arrive alone and obvious.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /repo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    # Majors arrive as their own PR: for this service a major bump of
    # `openidconnect`, `axum` or `rusqlite` is a change to a security boundary,
    # not a routine update.

  - package-ecosystem: npm
    # The UI is a STANDALONE pnpm workspace, deliberately not part of the outer
    # monorepo's — so the manifest path is here, not at the repo root.
    directory: /repo/ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain` is referenced by TAG, and one of those tags is
      # the MSRV the `msrv` job exists to check. Dependabot reads that ref as an
      # action version and bumps it, which silently converts the job from "does
      # this build on 1.88?" into "does this build on the newest toolchain?" —
      # the question every other job already answers. It did exactly that on its
      # first run. `ci.yml` now passes the toolchain as a `with:` value so the
      # ref is safe to bump, and this stays as the second lock on the door.
      - dependency-name: dtolnay/rust-toolchain
